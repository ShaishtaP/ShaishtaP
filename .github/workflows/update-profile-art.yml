name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC (11:47 IST) daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/*.mjs", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/fetch-contributions.mjs
      - run: node scripts/render-heatmap.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
